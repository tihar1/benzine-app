    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            /* Zorgt voor ruimte bovenaan zodat de notch van de iPhone niet over de tekst valt */
            padding-top: env(safe-area-inset-top, 20px); 
            max-width: 500px;
            margin: 0 auto;
            -webkit-tap-highlight-color: transparent;
        }

        h2 { 
            text-align: center; 
            color: #264653; 
            font-weight: 800;
            text-transform: lowercase;
            font-size: 2em;
            letter-spacing: -1px;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9em;
            color: #7f8c8d;
            text-transform: lowercase;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #ecf0f1;
            background-color: #fafafa;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            color: #2c3e50;
            transition: border-color 0.3s;
            -webkit-appearance: none; /* Verwijdert standaard iOS styling */
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #2a9d8f;
            background-color: #fff;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, opacity 0.2s;
            text-decoration: none;
        }

        .btn:active { transform: scale(0.98); }

        .btn-action { 
            background-color: #2a9d8f; 
            color: white; 
            box-shadow: 0 4px 6px rgba(42, 157, 143, 0.2);
        }

        .btn-maps {
            background-color: white;
            color: #2a9d8f;
            border: 2px solid #2a9d8f;
            display: inline-block;
            width: auto;
            padding: 10px 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-reset { 
            background-color: #e9c46a; 
            color: #264653; 
            margin-top: 10px;
        }
